<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorry Kaileigh</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .box {
      background: rgba(0,0,0,0.5);
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      z-index: 2;
    }

    h1 { font-size: 38px; }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .heart {
      font-size: 50px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* floating hearts */
    .heart-float {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      animation: rise 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes rise {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* button */
    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: #ee9ca7;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

<!-- MUSIC (Green Day - Last Night on Earth vibe) -->
<audio id="bgmusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<!-- HEARTS -->
<div class="heart-float" style="left:10%">💔</div>
<div class="heart-float" style="left:25%; animation-delay:1s">❤️</div>
<div class="heart-float" style="left:40%; animation-delay:2s">💔</div>
<div class="heart-float" style="left:60%; animation-delay:3s">❤️</div>
<div class="heart-float" style="left:80%; animation-delay:4s">💔</div>

<div class="box">
  <div class="heart">💔</div>
  <h1>Sorry Kaileigh</h1>

  <p>
    Nagkamali ako...<br>
    Nagso-sorry ako sincerely.<br>
    Nanghihingi ako ng forgiveness.<br>
    Ayokong mawala ka sa buhay ko.<br>
    Mahal na mahal kita.
  </p>

  <button onclick="playMusic()">▶ Click mo ako</button>
</div>

<script>
function playMusic() {
  document.getElementById("bgmusic").play();
  alert("Sorry Kaileigh 💔");
}
</script>

</body>
</html>
